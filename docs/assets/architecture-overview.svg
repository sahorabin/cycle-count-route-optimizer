<g fill="none" stroke-width="1.9">
 <path d="M240,214 L240,368" stroke="#94a3b8" marker-end="url(#aS)"/>
 <path d="M380,432 L424,432" stroke="#60a5fa" marker-end="url(#aB)"/>
 <path d="M710,432 L1019,432" stroke="#60a5fa" marker-end="url(#aB)"/>
 <path d="M1265,214 L1265,290" stroke="#94a3b8" marker-end="url(#aS)"/>
 <path d="M760,214 L760,424 A9,9 0 0 1 760,440 L760,586" stroke="#f59e0b" stroke-width="2.2" marker-end="url(#aA)"/>
 <path d="M1250,568 L1250,586" stroke="#60a5fa" marker-end="url(#aB)"/>
 <path d="M1060,658 L966,658" stroke="#60a5fa" marker-end="url(#aB)"/>
 <path d="M760,724 L760,750" stroke="#60a5fa" marker-end="url(#aB)"/>
 <path d="M265,718 L265,750" stroke="#94a3b8" stroke-dasharray="6 4" marker-end="url(#aS)"/>
</g>
<text x="866" y="420" class="f el" text-anchor="middle">same distance model</text>
<text x="774" y="570" class="f el" fill="#d8a75e">timeline only — never optimization</text>
<text x="279" y="742" class="f el">simulation time</text>

<!-- ================= FIREWALL ================= -->
<line x1="60" y1="856" x2="1540" y2="856" stroke="#2dd4bf" stroke-width="2.4"/>
<g fill="none" stroke="#2dd4bf" stroke-width="2.2">
 <path d="M264,832 L264,916" marker-end="url(#aT)"/>
 <path d="M621,832 L621,916" marker-end="url(#aT)"/>
 <path d="M978,832 L978,916" marker-end="url(#aT)"/>
 <path d="M1335,832 L1335,916" marker-end="url(#aT)"/>
</g>
<rect x="686" y="840" width="228" height="32" rx="16" fill="#0d1524" stroke="#2dd4bf" stroke-width="1.7"/>
<text x="800" y="862" class="f fw" text-anchor="middle">READ-ONLY BOUNDARY</text>

<!-- ================= BAND 3 ================= -->
<rect x="60" y="876" width="1480" height="124" rx="10" fill="#0e2422" stroke="#14b8a6" stroke-width="1.4"/>
<text x="80" y="902" class="f band" fill="#5eead4">③ PRESENTATION</text>

<rect x="100" y="922" width="329" height="66" rx="8" fill="#123330" stroke="#2dd4bf" stroke-width="1.2"/>
<text x="118" y="950" class="f nt" fill="#e2fbf6">Planning Map</text>
<text x="118" y="973" class="f ns" fill="#94cec6">2D SVG route preview</text>

<rect x="457" y="922" width="329" height="66" rx="8" fill="#123330" stroke="#2dd4bf" stroke-width="1.2"/>
<text x="475" y="950" class="f nt" fill="#e2fbf6">3D Digital Twin</text>
<text x="475" y="973" class="f ns" fill="#94cec6">warehouse · operator · minimap</text>

<rect x="814" y="922" width="329" height="66" rx="8" fill="#123330" stroke="#2dd4bf" stroke-width="1.2"/>
<text x="832" y="950" class="f nt" fill="#e2fbf6">Worker / COUNTING State</text>
<text x="832" y="973" class="f ns" fill="#94cec6">travel · scan · service progress</text>

<rect x="1171" y="922" width="329" height="66" rx="8" fill="#123330" stroke="#2dd4bf" stroke-width="1.2"/>
<text x="1189" y="950" class="f nt" fill="#e2fbf6">Worker vs Recommended</text>
<text x="1189" y="973" class="f ns" fill="#94cec6">two views · one playback clock</text>

<!-- ================= FOOTER ================= -->
<line x1="60" y1="1008" x2="1540" y2="1008" stroke="#26364f"/>
<g class="f pr">
 <rect x="100" y="1024" width="9" height="9" rx="2" fill="#2dd4bf"/>
 <text x="120" y="1033">Rendering cannot redefine route truth.</text>
 <rect x="830" y="1024" width="9" height="9" rx="2" fill="#2dd4bf"/>
 <text x="850" y="1033">Playback speed cannot change physical KPIs.</text>
 <rect x="100" y="1050" width="9" height="9" rx="2" fill="#f59e0b"/>
 <text x="120" y="1059">Service time is excluded from route optimization.</text>
 <rect x="830" y="1050" width="9" height="9" rx="2" fill="#60a5fa"/>
 <text x="850" y="1059">Worker and Recommended differ in visit sequence, not assumptions.</text>
</g>
</svg>
