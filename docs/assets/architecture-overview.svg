<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1080" width="1600" height="1080" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Cycle Count Route Optimizer — Operational Architecture</title>
<desc id="dsc">Three layered bands. Operations input — warehouse data, physical assumptions, and location selection — feeds a domain and simulation truth layer: warehouse graph, Dijkstra shortest paths, a worker route and a Nearest Neighbor plus 2-opt recommended route sharing the same targets, then RouteTraversal, RouteTimeline carrying separate travel and service phases, and SimulationSnapshot. A PlaybackClock supplies simulation time only and never reaches the timeline. A read-only boundary separates that truth from the presentation layer: planning map, 3D digital twin, worker counting state, and worker versus recommended compare. Every arrow crossing the boundary points downward.</desc>
<style>
 .f{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
 .h1{font-size:34px;font-weight:700;fill:#f1f5f9}
 .h2{font-size:16.5px;font-weight:600;fill:#5eead4;letter-spacing:2.8px}
 .kick{font-size:14.5px;fill:#93a7c1}
 .band{font-size:13.5px;font-weight:700;fill:#9fb1c9;letter-spacing:2px}
 .nt{font-size:19px;font-weight:700;fill:#eaf1fa}
 .ns{font-size:14.5px;fill:#a6b9d1}
 .nf{font-size:12.5px;fill:#7b8fa8}
 .chip{font-size:13.5px;font-weight:600;fill:#d5e5fa}
 .chipA{font-size:13.5px;font-weight:600;fill:#fcd34d}
 .el{font-size:13px;fill:#93a7c1}
 .fw{font-size:16px;font-weight:700;fill:#5eead4;letter-spacing:1.4px}
 .snt{font-size:23px;font-weight:700;fill:#eef4ff}
 .sns{font-size:15px;fill:#b3c6dd}
 .pr{font-size:14px;fill:#b3c6dd}
</style>
<defs>
 <marker id="aB" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#60a5fa"/></marker>
 <marker id="aS" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
 <marker id="aA" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker>
 <marker id="aT" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2dd4bf"/></marker>
</defs>

<rect width="1600" height="1080" fill="#0d1524"/>

<!-- ================= HEADER ================= -->
<g class="f">
 <text x="60" y="52" class="h1">Cycle Count Route Optimizer</text>
 <text x="61" y="82" class="h2">OPERATIONAL ARCHITECTURE</text>
 <text x="1540" y="46" class="kick" text-anchor="end">Aisle-constrained route planning → physical simulation → Digital Twin replay</text>
 <text x="1540" y="70" class="nf" text-anchor="end">React · TypeScript · Three.js / React Three Fiber</text>
</g>

<!-- ================= BAND 1 ================= -->
<rect x="60" y="100" width="1480" height="128" rx="10" fill="#141f33" stroke="#3d4d66"/>
<text x="80" y="126" class="f band">① OPERATIONS INPUT</text>

<rect x="100" y="138" width="280" height="76" rx="8" fill="#1b2942" stroke="#647d9e" stroke-width="1.3"/>
<text x="118" y="166" class="f nt">Warehouse Data</text>
<text x="118" y="188" class="f ns">10 zones · 100 count locations</text>
<text x="118" y="207" class="f ns">aisle graph · bin access spurs</text>

<rect x="530" y="138" width="460" height="76" rx="8" fill="#241f16" stroke="#f59e0b" stroke-width="1.4"/>
<text x="548" y="164" class="f nt">Physical Assumptions</text>
<rect x="548" y="176" width="196" height="30" rx="6" fill="#31280f" stroke="#a16207"/>
<text x="646" y="196" class="f chipA" text-anchor="middle">Walking speed · 60 m/min</text>
<rect x="756" y="176" width="218" height="30" rx="6" fill="#31280f" stroke="#a16207"/>
<text x="865" y="196" class="f chipA" text-anchor="middle">Count service · 20 / 35 / 60 s</text>

<rect x="1075" y="138" width="380" height="76" rx="8" fill="#1b2942" stroke="#647d9e" stroke-width="1.3"/>
<text x="1093" y="166" class="f nt">Location Selection</text>
<text x="1093" y="188" class="f ns">selection order = worker visit order</text>
<text x="1093" y="207" class="f ns">defines the target set for both routes</text>

<!-- ================= BAND 2 ================= -->
<rect x="60" y="256" width="1480" height="590" rx="10" fill="#101a2e" stroke="#2563eb" stroke-width="2.2"/>
<text x="80" y="284" class="f band">② OPERATIONAL TRUTH — domain + simulation</text>

<rect x="100" y="374" width="280" height="116" rx="8" fill="#17284a" stroke="#3b82f6" stroke-width="1.4"/>
<text x="118" y="406" class="f nt">Warehouse Graph</text>
<text x="118" y="430" class="f ns">aisle nodes + edges</text>
<text x="118" y="452" class="f ns">bins on access spurs</text>
<text x="118" y="474" class="f nf">bins are never pass-through nodes</text>

<rect x="430" y="374" width="280" height="116" rx="8" fill="#17284a" stroke="#3b82f6" stroke-width="1.4"/>
<text x="448" y="406" class="f nt">Shortest Paths</text>
<text x="448" y="430" class="f ns" fill="#7dd3fc">Dijkstra</text>
<text x="448" y="452" class="f ns">aisle-constrained</text>
<text x="448" y="474" class="f ns">distance matrix</text>

<rect x="1025" y="296" width="480" height="272" rx="10" fill="#13203a" stroke="#3b82f6" stroke-width="1.2" stroke-dasharray="7 5"/>
<text x="1045" y="322" class="f band">ROUTE SEQUENCE</text>
<text x="1045" y="342" class="f nf">same targets · same graph · same assumptions</text>

<rect x="1045" y="354" width="440" height="84" rx="8" fill="#17284a" stroke="#60a5fa" stroke-width="1.4"/>
<text x="1063" y="386" class="f nt">Worker Route</text>
<text x="1063" y="412" class="f ns">operator-defined visit order</text>

<rect x="1045" y="452" width="440" height="108" rx="8" fill="#17284a" stroke="#60a5fa" stroke-width="1.4"/>
<text x="1063" y="482" class="f nt">Recommended Route</text>
<rect x="1061" y="494" width="168" height="30" rx="6" fill="#1d3663" stroke="#3b82f6"/>
<text x="1145" y="514" class="f chip" text-anchor="middle">Nearest Neighbor</text>
<text x="1239" y="515" class="f ns" fill="#60a5fa">→</text>
<rect x="1255" y="494" width="176" height="30" rx="6" fill="#1d3663" stroke="#3b82f6"/>
<text x="1343" y="514" class="f chip" text-anchor="middle">2-opt refinement</text>
<text x="1063" y="546" class="f nf">heuristic optimization — local optimum, not exact TSP</text>

<rect x="110" y="602" width="310" height="116" rx="8" fill="#161f33" stroke="#64748b" stroke-width="1.3" stroke-dasharray="6 4"/>
<text x="128" y="634" class="f nt" fill="#cbd5e1">PlaybackClock</text>
<text x="128" y="658" class="f ns">frame delta × playbackRate</text>
<text x="128" y="680" class="f nf">0.5× … 10×</text>
<text x="128" y="700" class="f nf">replay progression only</text>

<rect x="560" y="592" width="400" height="132" rx="8" fill="#17284a" stroke="#3b82f6" stroke-width="1.4"/>
<text x="578" y="622" class="f nt">RouteTimeline</text>
<rect x="578" y="636" width="140" height="30" rx="6" fill="#1d3663" stroke="#3b82f6"/>
<text x="648" y="656" class="f chip" text-anchor="middle">TRAVEL phases</text>
<rect x="730" y="636" width="212" height="30" rx="6" fill="#31280f" stroke="#f59e0b"/>
<text x="836" y="656" class="f chipA" text-anchor="middle">SERVICE / COUNTING phases</text>
<text x="578" y="692" class="f ns">physical durations — walking + service</text>
<text x="578" y="712" class="f nf">route distance · KPI truth</text>

<rect x="1060" y="592" width="380" height="132" rx="8" fill="#17284a" stroke="#3b82f6" stroke-width="1.4"/>
<text x="1078" y="636" class="f nt">RouteTraversal</text>
<text x="1078" y="662" class="f ns">spatial execution truth</text>
<text x="1078" y="684" class="f ns">node-by-node walk through the aisles</text>

<rect x="100" y="756" width="1405" height="76" rx="9" fill="#1d3a6e" stroke="#7dd3fc" stroke-width="2"/>
<text x="802" y="790" class="f snt" text-anchor="middle">SimulationSnapshot</text>
<text x="802" y="815" class="f sns" text-anchor="middle">state at simulation time t — the single boundary between operational truth and what is drawn</text>

